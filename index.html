<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Coin Company</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#102a43;
color:#fff;
padding:24px 16px;
text-align:center;
}

header h1{
margin:0 0 6px;
font-size:28px;
}

header p{
margin:0;
opacity:.9;
}

main{
max-width:850px;
margin:20px auto;
padding:0 14px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 20px #00000012;
}

h2{
margin-top:0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.full{
grid-column:1/-1;
}

label{
font-weight:700;
display:block;
}

input,
textarea,
select{
width:100%;
margin-top:7px;
padding:12px;
border:1px solid #ccd4df;
border-radius:10px;
font-size:16px;
background:#fff;
}

textarea{
min-height:90px;
resize:vertical;
}

.item{
border:1px solid #dbe2ea;
border-radius:14px;
padding:14px;
margin-top:14px;
}

.itemhead{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.primary{
width:100%;
background:#102a43;
color:#fff;
margin-top:18px;
}

.secondary{
background:#e9eef5;
color:#102a43;
}

.remove{
background:#ffe7e7;
color:#9b1c1c;
}

.notice{
background:#eef6ff;
border-left:4px solid #2878c8;
padding:12px;
border-radius:8px;
}

.success{
background:#e9f8ee;
border-left:4px solid #16823b;
padding:14px;
border-radius:8px;
}

.error{
background:#fff0f0;
border-left:4px solid #c62828;
padding:14px;
border-radius:8px;
}

.reqid{
font-size:20px;
font-weight:800;
}

.small{
font-size:13px;
color:#5c6675;
}

@media(max-width:650px){
.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}
}
</style>
</head>

<body>

<header>
<h1>Old Coin Company</h1>
<p>पुराने सिक्के और नोट खरीदने के लिए Request भेजें</p>
</header>

<main>

<div class="card">

<h2>Customer Request / ग्राहक Request</h2>

<div class="notice">
कृपया सही नाम, मोबाइल और पता भरें।
एक या अधिक पुराने सिक्के/नोट की जानकारी भेज सकते हैं।
</div>

<form id="requestForm">

<div class="grid" style="margin-top:14px">

<label>
नाम / Name
<input
name="name"
required
maxlength="100"
autocomplete="name">
</label>

<label>
मोबाइल / Mobile
<input
name="mobile"
required
maxlength="20"
inputmode="tel"
autocomplete="tel">
</label>

<label class="full">
पता / Address
<textarea
name="address"
required
maxlength="500"
autocomplete="street-address"></textarea>
</label>

<label class="full">
Customer Photo / ग्राहक फोटो (वैकल्पिक)
<input
name="customer_photo"
type="file"
accept="image/*">
</label>

</div>

<div id="items"></div>

<button
type="button"
id="addItemBtn"
class="secondary"
style="margin-top:14px">
+ दूसरा Item जोड़ें
</button>

<label style="margin-top:16px">
Registration Fee
<input
name="registration_fee"
type="number"
min="0"
step="0.01"
value="0">
</label>

<button
type="submit"
class="primary">
Request Submit करें
</button>

</form>

<div
id="result"
hidden
style="margin-top:16px">
</div>

</div>


<div class="card">

<h2>Request Status</h2>

<input
id="trackId"
placeholder="जैसे OCC-123456">

<button
id="trackBtn"
class="secondary"
style="margin-top:10px">
Status Check
</button>

<div
id="trackResult"
style="margin-top:12px">
</div>

</div>

</main>


<script>

/* ================================
   SUPABASE SETTINGS
================================ */

const SUPABASE_URL =
'https://giqpgthlmargepysurqz.supabase.co';

const SUPABASE_KEY =
'sb_publishable_spCQBKwK2QPu3G6GivA7dg_C2lWILmX';

const TABLE_URL =
SUPABASE_URL + '/rest/v1/requests';


/* ================================
   ITEM SYSTEM
================================ */

let itemNo = 0;


function makeId(){

return 'OCC-' +
Math.floor(
100000 +
Math.random()*900000
);

}


function addItem(){

itemNo++;

const box =
document.createElement('div');

box.className='item';

box.innerHTML=`

<div class="itemhead">

<b>
Item ${itemNo}
</b>

<button
type="button"
class="remove">
हटाएँ
</button>

</div>


<div
class="grid"
style="margin-top:12px">


<label>

Type / प्रकार

<select name="type">

<option>
Old Coin / पुराना सिक्का
</option>

<option>
Old Note / पुराना नोट
</option>

</select>

</label>


<label>

Year / वर्ष

<input
name="year"
maxlength="4"
inputmode="numeric"
placeholder="जैसे 1947">

</label>


<label>

Quantity / संख्या

<input
name="qty"
type="number"
min="1"
value="1">

</label>


<label>

Photo / फोटो (वैकल्पिक)

<input
name="photo"
type="file"
accept="image/*"
multiple>

</label>


<label class="full">

Details / विवरण

<textarea
name="details"
maxlength="1000"
placeholder="नोट या सिक्के की जानकारी">
</textarea>

</label>

</div>

`;


box
.querySelector('.remove')
.onclick=()=>{
box.remove();
};


document
.getElementById('items')
.appendChild(box);

}


addItem();


document
.getElementById('addItemBtn')
.onclick=addItem;


/* ================================
   FILE NAME
================================ */

function fileNames(input){

return [
...(input?.files || [])
]
.map(
file=>file.name
)
.join(', ');

}


/* ================================
   SEND REQUEST TO SUPABASE
================================ */

async function submitRequest(row){

const response =
await fetch(
TABLE_URL,
{
method:'POST',

headers:{
'apikey':SUPABASE_KEY,

'Authorization':
'Bearer '+SUPABASE_KEY,

'Content-Type':
'application/json',

'Prefer':
'return=minimal'
},

body:
JSON.stringify(row)

}
);


if(!response.ok){

let detail='';

try{
detail=
await response.text();
}
catch(e){}

throw new Error(
'Supabase HTTP '+
response.status+
(detail ?
': '+detail :
'')
);

}

}


/* ================================
   REQUEST FORM
================================ */

document
.getElementById('requestForm')
.addEventListener(
'submit',
async function(e){

e.preventDefault();


const form=e.currentTarget;

const btn=
form.querySelector(
'button[type="submit"]'
);

const result=
document.getElementById(
'result'
);


const requestId=
makeId();


btn.disabled=true;

btn.textContent=
'Submit हो रहा है...';

result.hidden=true;


try{


const name=
form
.querySelector(
'[name="name"]'
)
.value
.trim();


const mobile=
form
.querySelector(
'[name="mobile"]'
)
.value
.trim();


const address=
form
.querySelector(
'[name="address"]'
)
.value
.trim();


const fee=
Number(
form
.querySelector(
'[name="registration_fee"]'
)
.value || 0
);


const items=[
...
document.querySelectorAll(
'#items .item'
)
];


if(!items.length){

throw new Error(
'कम से कम एक item जोड़ें।'
);

}


/* ================================
   SAVE EACH ITEM
================================ */

for(
let i=0;
i<items.length;
i++
){

const el=
items[i];


const row={

request_id:
requestId,


customer_name:
name,


customer_phone:
mobile,


customer_address:
address,


item_name:
el
.querySelector(
'[name="type"]'
)
.value,


item_description:

'Year: '+
(
el
.querySelector(
'[name="year"]'
)
.value || '-'
)

+
' | Quantity: '+

(
el
.querySelector(
'[name="qty"]'
)
.value || 1
)

+
' | Details: '+

(
el
.querySelector(
'[name="details"]'
)
.value || ''
)

+
' | Photo files: '+

fileNames(
el.querySelector(
'[name="photo"]'
)
),


"offer price":
null,


status:
'New / नया',


image_url:
null,


payment_status:
'Not Required',


payment_screenshot_url:
null,


registration_fee:
fee,


customer_photo_url:
null

};


/* SAVE */

await submitRequest(row);

}


/* ================================
   SUCCESS
================================ */

localStorage.setItem(
'occ_last_request',
requestId
);


result.className=
'success';


result.innerHTML=

'<b>'+
'Request सफलतापूर्वक भेज दी गई।'+
'</b>'+

'<br><br>'+

'आपकी Request ID: '+

'<span class="reqid">'+
requestId+
'</span>'+

'<br>'+

'<span class="small">'+
'इस ID को सुरक्षित रखें।'+
'</span>';


result.hidden=false;


/* RESET */

form.reset();


document
.getElementById('items')
.innerHTML='';


itemNo=0;

addItem();


}


/* ================================
   ERROR
================================ */

catch(err){

console.error(err);


result.className=
'error';


result.innerHTML=

'<b>'+
'Request भेजी नहीं जा सकी।'+
'</b>'+

'<br><br>'+

String(
err.message || err
)
.replace(
/</g,
'&lt;'
);


result.hidden=false;

}


/* ================================
   BUTTON RESET
================================ */

finally{

btn.disabled=false;

btn.textContent=
'Request Submit करें';

}

});


/* ================================
   STATUS CHECK
================================ */

document
.getElementById('trackBtn')
.onclick=function(){

const id=
document
.getElementById('trackId')
.value
.trim()
.toUpperCase();


const out=
document.getElementById(
'trackResult'
);


if(!id){

out.innerHTML=
'<div class="error">'+
'पहले Request ID डालें।'+
'</div>';

return;

}


out.innerHTML=

'<div class="notice">'+

'<b>'+
id+
'</b>'+

'<br>'+

'Status lookup को secure admin व्यवस्था से जोड़ा जाएगा।'+

'</div>';

};

</script>

</body>
</html>
